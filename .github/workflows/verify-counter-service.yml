name: Verify published Counter Service APK
on:
  push:
    branches: [qa/counter-service-apk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download and identify the published binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download internal-efcef962773f --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir build
          echo 'bc1d4476398edace3040418c543458d2d2bf1948a35b70cc8c817b58d937f50c  build/Qofeno-Simulation-0.5.1-internal.apk' | sha256sum --check
      - name: Boot APK on Android 15 and restore a shift
        timeout-minutes: 20
        run: |
          if ! command -v tesseract || ! /usr/bin/python3 -c "import PIL"; then sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr python3-pil; fi
          package=com.qofeno.simulation.internal
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then package=com.qofeno.simulation; fi
          if ! LIBGL_ALWAYS_SOFTWARE=1 QOFENO_EMULATOR_GPU=host xvfb-run -a bash ci/device-smoke.sh "$package"; then
            if ! grep -Eq 'Fragment shader active uniforms exceed|Invalid GPU mode|Failed to initialize EGL|glestranslator/.*error null ctx|Failed to bind to texture|eglInitialize failed|Could not initialize emulated framebuffer' "$RUNNER_TEMP"/qofeno-device/*.txt "$RUNNER_TEMP"/qofeno-device/*.log; then exit 1; fi
            mv "$RUNNER_TEMP/qofeno-device" "$RUNNER_TEMP/qofeno-device-first"
            QOFENO_EMULATOR_GPU=lavapipe bash ci/device-smoke.sh "$package"
          fi
      - name: Preserve device diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-diagnostics
          path: |
            build/device/
            ${{ runner.temp }}/qofeno-device/
          retention-days: 5
      - name: Upload Android device evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Android-device
          path: build/device/
          if-no-files-found: error
          retention-days: 14
