name: Game validation
on:
  pull_request:
  push:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: game-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Godot
        run: |
          mkdir -p "$RUNNER_TEMP/qofeno-godot"
          cd "$RUNNER_TEMP/qofeno-godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o godot.zip
          echo '5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9  godot.zip' | sha512sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          ln -s Godot_v4.5.1-stable_linux.x86_64 godot
          echo "$RUNNER_TEMP/qofeno-godot" >> "$GITHUB_PATH"
      - name: Import runtime assets
        run: |
          godot --headless --path game --editor --import --quit 2>&1 | tee import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' import.log; then exit 1; fi
      - name: Validate gameplay and input flows
        run: |
          python3 tools/configure_texture_imports.py --check
          python3 tools/validate_art_assets.py
          for test in ../tests/session_test.gd ../tests/world_test.gd res://tests/vehicle_test.gd res://tests/drive_controls_test.gd res://tests/handling_test.gd res://tests/vehicle_presentation_test.gd res://tests/mobile_render_profile_test.gd res://tests/ui_flow_test.gd ../tests/smoke_test.gd; do
            godot --headless --path game --script "$test" --fixed-fps 60 2>&1 | tee test.log
            if grep -Eq 'SCRIPT ERROR:|ERROR:' test.log; then exit 1; fi
          done
          node --test tools/release.test.mjs
      - name: Install software Vulkan test driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth
      - name: Validate actual Mobile rendering and capture screens
        run: |
          mkdir -p build
          timeout 180s xvfb-run -a godot --path game --audio-driver Dummy --rendering-method mobile --rendering-driver vulkan --script res://tests/mobile_render_profile_test.gd -- --require-mobile 2>&1 | tee build/mobile-profile.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:' build/mobile-profile.log; then exit 1; fi
          timeout 180s xvfb-run -a -s '-screen 0 1600x1000x24' godot --path game --audio-driver Dummy --rendering-method mobile --rendering-driver vulkan --script ../tests/capture_preview.gd 2>&1 | tee build/mobile-render.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:' build/mobile-render.log; then exit 1; fi
          grep -q 'RENDER_PROFILE method=mobile' build/mobile-render.log
          grep -q 'RENDER_CAPTURE_PASS' build/mobile-render.log
      - name: Save rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-render-review
          path: |
            build/previews/*.png
            build/mobile-profile.log
            build/mobile-render.log
          if-no-files-found: ignore
