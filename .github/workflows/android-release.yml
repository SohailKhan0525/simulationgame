name: Qofeno Drive Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qofeno-android-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing configuration
        env:
          KEY_PASSWORD: ${{ secrets.QOFENO_KEYSTORE_PASSWORD }}
        run: |
          test -s signings/qofeno-release.keystore
          if [[ -z "$KEY_PASSWORD" ]]; then
            echo '::error::The existing signings/qofeno-release.keystore needs its password in the QOFENO_KEYSTORE_PASSWORD Actions secret.'
            exit 1
          fi
          "$JAVA_HOME/bin/keytool" -list -keystore signings/qofeno-release.keystore \
            -alias qofeno -storepass:env KEY_PASSWORD > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Godot and official Android templates
        run: bash tools/build-setup-godot.sh "$RUNNER_TEMP/godot"

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'

      - name: Install release tools and validate versioning
        run: |
          npm ci --ignore-scripts
          npm run test:release

      - name: Import game and test saved progression
        run: |
          godot --headless --path game --editor --import --quit 2>&1 | tee /tmp/qofeno-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/qofeno-import.log; then exit 1; fi
          python3 tools/configure_texture_imports.py --check
          python3 tools/validate_art_assets.py
          godot --headless --path game --script ../tests/session_test.gd
          godot --headless --path game --script ../tests/world_test.gd
          godot --headless --path game --script res://tests/vehicle_test.gd --fixed-fps 60
          godot --headless --path game --script res://tests/drive_controls_test.gd --fixed-fps 60
          godot --headless --path game --script res://tests/handling_test.gd --fixed-fps 60
          godot --headless --path game --script res://tests/vehicle_presentation_test.gd --fixed-fps 60
          godot --headless --path game --script res://tests/mobile_render_profile_test.gd --fixed-fps 60
          godot --headless --path game --script res://tests/ui_flow_test.gd --fixed-fps 60
          godot --headless --path game --script ../tests/smoke_test.gd --fixed-fps 60

      - name: Build, verify, and publish Android release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/signings/qofeno-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: qofeno
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.QOFENO_KEYSTORE_PASSWORD }}
        run: |
          release_tags="$(git tag --merged HEAD --list)"
          if printf '%s\n' "$release_tags" | grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' > /dev/null; then
            npm run release
          else
            # semantic-release defaults an untagged repository to 1.0.0.
            # Publish the requested checked-in upgrade as the first real release.
            release_version="$(node tools/release.mjs --version)"
            node tools/release.mjs "$release_version"
            bash tools/build-android.sh
            gh release create "v$release_version" \
              build/Qofeno-Drive.apk build/Qofeno-Drive.apk.sha256 build/update.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Qofeno Drive $release_version" --generate-notes
          fi

      - name: Preserve verified APK build
        if: always() && hashFiles('build/update.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Qofeno-Drive-Android
          path: |
            build/Qofeno-Drive.apk
            build/Qofeno-Drive.apk.sha256
            build/update.json
            build/package.txt
            build/signature.txt
          compression-level: 0
          if-no-files-found: error

      - name: Summarize release
        if: success() && hashFiles('build/update.json') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('build/update.json'))
          print(f"Qofeno Drive **{data['version']}** has been built and verified.")
          print(f"\n[Download signed Android APK]({data['url']})")
          print('\nAndroid 8+; ARM64 and x86_64. Device playtesting is still required.')
          PY
